global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "homelab"

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "alloy"
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: "victorialogs"
    static_configs:
      - targets: ["victorialogs:9428"]

  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "caddy"
    static_configs:
      - targets: ["caddy:2020"]

  - job_name: "blackbox"
    static_configs:
      - targets: ["blackbox:9115"]

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: ["http_2xx"]
    static_configs:
      - targets:
          - https://auth.home.rusak.eu
          - https://kuma.home.rusak.eu
          - https://dns.home.rusak.eu
          - https://nextcloud.home.rusak.eu
          - https://grafana.home.rusak.eu/api/health
          - https://dozzle.home.rusak.eu
          - https://prometheus.home.rusak.eu
          - https://alertmanager.home.rusak.eu
          - https://beszel.home.rusak.eu
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
