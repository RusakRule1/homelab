route:
  receiver: "telegram"
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      repeat_interval: 1h

receivers:
  - name: "telegram"
    telegram_configs:
      - bot_token_file: /run/secrets/alertmanager_telegram_token
        chat_id_file: /run/secrets/alertmanager_telegram_chatid
        parse_mode: "HTML"
        send_resolved: true
        message: |
          {{ if eq .Status "firing" }}🔴 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }} ({{ .Alerts | len }})
          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "instance"]
