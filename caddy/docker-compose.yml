services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab-caddy:2.11.4
    container_name: caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 128M, pids: 128 }
        reservations: { memory: 32M }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file:
      - ./secrets/porkbun.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/data
    networks:
      proxy:
        aliases:
          - auth.home.rusak.eu
          - kuma.home.rusak.eu
          - dns.home.rusak.eu
          - nextcloud.home.rusak.eu
          - grafana.home.rusak.eu
          - dozzle.home.rusak.eu
          - prometheus.home.rusak.eu
          - alertmanager.home.rusak.eu
          - beszel.home.rusak.eu
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
