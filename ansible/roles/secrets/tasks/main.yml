---
- name: Discover per-service secret bundles
  ansible.builtin.find:
    paths: "{{ (homelab_stacks + ['backup']) | map('regex_replace', '^', homelab_root ~ '/') | list }}"
    patterns: secrets.sops.yaml
    recurse: false
  register: secrets_bundles

- name: Decrypt and merge all per-service secret bundles
  ansible.builtin.set_fact:
    secrets_list: "{{ secrets_list | default([]) + (lookup('community.sops.sops', item) | from_yaml).secrets }}"
  loop: "{{ secrets_bundles.files | map(attribute='path') | sort }}"
  loop_control:
    label: "{{ item | dirname | basename }}"
  no_log: true

- name: Ensure secret parent directories exist
  ansible.builtin.file:
    path: "{{ homelab_root }}/{{ item.path | dirname }}"
    state: directory
    mode: "0700"
  loop: "{{ secrets_list }}"
  loop_control:
    label: "{{ item.path | dirname }}"

- name: Render secret files byte-exact with correct mode
  ansible.builtin.copy:
    dest: "{{ homelab_root }}/{{ item.path }}"
    content: "{{ item.data | b64decode }}"
    mode: "{{ item.mode }}"
  loop: "{{ secrets_list }}"
  loop_control:
    label: "{{ item.path }}"
  no_log: true
